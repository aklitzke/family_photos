name = "family-photos-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"
workers_dev = true

[build]
command = "cargo install -q -f worker-build && worker-build --release"

[[r2_buckets]]
binding = "google_drive_pics"
bucket_name = "google-drive-pics"
preview_bucket_name = "google-drive-pics"

[[r2_buckets]]
binding = "thumbnails"
bucket_name = "thumbnails"
preview_bucket_name = "thumbnails"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

# GitHub API access token (required for updating history.toml in production)
# To set: wrangler secret put GITHUB_TOKEN
# Generate a personal access token at: https://github.com/settings/tokens
# Required scopes: repo (for private repos) or public_repo (for public repos)
# Note: Not needed for local dev builds (use_local_history_file flag is auto-enabled in debug)

# Development environment - automatically uses bundled history.toml via use_local_history_file cfg
[env.dev]
[env.dev.build]
command = "cargo install -q worker-build && worker-build --dev"

[[env.dev.r2_buckets]]
binding = "google_drive_pics"
bucket_name = "google-drive-pics"
preview_bucket_name = "google-drive-pics"

[[env.dev.r2_buckets]]
binding = "thumbnails"
bucket_name = "thumbnails"
preview_bucket_name = "thumbnails"

# To deploy:
# 1. Install wrangler: npm install -g wrangler
# 2. Login: wrangler login
# 3. Create R2 bucket: wrangler r2 bucket create family-photos
# 4. Deploy: wrangler deploy
