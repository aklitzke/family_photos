[package]
name = "family-photos"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.22"
image = "0.25"
common = { version = "0.1.0", path = "../common" }
urlencoding = "2.1"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
