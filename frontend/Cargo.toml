[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
common = { version = "0.1.0", path = "../common" }
console_error_panic_hook = "0.1.7"
eframe = "0.33.3"
egui_extras = "0.33.3"
ehttp = "0.6.0"
gloo-timers = { version = "0.3.0", features = ["futures"] }
image = "0.25.9"
poll-promise = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
urlencoding = "2.1.3"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
js-sys = "0.3"
web-sys = { version = "0.3.83", features = [
    "Blob", "CanvasRenderingContext2d", "Document",
    "HtmlCanvasElement", "History", "ImageBitmap", "ImageData",
    "Location", "Request", "RequestInit", "RequestMode",
    "Response", "Url", "Window",
] }
