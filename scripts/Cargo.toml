[package]
name = "scripts"
version = "0.1.0"
edition = "2021"

[lib]
name = "scripts"
path = "src/lib.rs"

[dependencies]
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.47"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dotenv = "0.15"
common = { path = "../common" }
