[package]
name = "scripts"
version = "0.1.0"
edition = "2021"

[lib]
name = "scripts"
path = "src/lib.rs"

[dependencies]
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.47"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
rand = "0.8"
common = { path = "../common" }
family-photos = { path = "../worker" }
walkdir = "2.4"
image = "0.25"
regex = "1.10"
